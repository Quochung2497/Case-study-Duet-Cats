name: PR Validation

on:
  # Validate PRs whose destination branch is Main, including new commits added to an open PR.
  pull_request:
    branches: [Main]
  # Allow a manual run from the Actions tab once this workflow exists on the default branch.
  workflow_dispatch:

# These checks only need to read the repository; they do not publish or modify it.
permissions:
  contents: read

# Keep the latest run for each PR (or branch for manual runs) and cancel an older unfinished run.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR Validation
    # Use a GitHub-hosted Linux runner and stop the job if it exceeds one hour.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # For a PR, check out GitHub's proposed merge commit so the checks cover its result on Main.
      # Fetch the full history; each external action is pinned to an exact commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Fail on repository data errors before downloading dependencies or starting Unity.
      - name: Check conflict markers, metadata, GUIDs and JSON
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path, PurePosixPath

          # Python accepts NaN/Infinity by default; reject them because they are not valid JSON.
          def invalid_constant(value):
              raise ValueError(f'Invalid JSON constant: {value}')

          # Validate the full tracked checkout; ignored Spine/TMP files are restored in the next step.
          files = set(subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')) - {''}
          # Match unresolved Git conflict markers, including diff3 base markers and longer markers.
          markers = re.compile(r'^(?:<{7,}(?:\s.*)?|={7,}|>{7,}(?:\s.*)?|\|{7,}(?:\s.*)?)$')
          # Collect all errors, record the owner of each GUID and track asset folder ancestors.
          errors, guids, folders = [], {}, set()
          for name in sorted(files):
              data, text = Path(name).read_bytes(), ''
              # Scan readable UTF-8 text (with or without a BOM); skip binary/non-UTF-8 marker scans.
              if b'\0' not in data:
                  try:
                      text = data.decode('utf-8-sig')
                  except UnicodeDecodeError:
                      pass
              # Report each conflict marker with its file path and line number.
              for line_number, line in enumerate(text.splitlines(), 1):
                  if markers.fullmatch(line):
                      errors.append(f'{name}:{line_number}: unresolved conflict marker')
              # Unity input actions and assembly definitions/references also contain JSON.
              if Path(name).suffix.lower() in {'.json', '.inputactions', '.asmdef', '.asmref'}:
                  try:
                      json.loads(data.decode('utf-8-sig'), parse_constant=invalid_constant)
                  except ValueError as error:
                      errors.append(f'{name}: invalid JSON: {error}')
              # Only files inside Assets require Unity metadata and asset GUID checks.
              if not name.startswith('Assets/'):
                  continue
              # Every tracked asset folder needs its own .meta; the Assets root is excluded.
              folders.update(str(p) for p in PurePosixPath(name).parents if str(p) not in {'.', 'Assets'})
              # The matching .meta must be committed, not merely present on a developer's machine.
              if not name.endswith('.meta'):
                  if name + '.meta' not in files:
                      errors.append(f'{name}: missing tracked .meta file')
                  continue
              # Each .meta must contain one 32-digit hexadecimal GUID, unique across tracked Assets.
              # Compare GUIDs without case differences and include the other file in duplicate errors.
              values = re.findall(r'^guid:[ \t]*(\S+)[ \t]*\r?$', text, re.MULTILINE)
              if len(values) != 1 or not re.fullmatch(r'[0-9a-fA-F]{32}', values[0]):
                  errors.append(f'{name}: expected exactly one valid GUID')
              elif values[0].lower() in guids:
                  errors.append(f'{name}: GUID also used by {guids[values[0].lower()]}')
              else:
                  guids[values[0].lower()] = name
          # Check folder metadata after collecting all ancestors, then fail with all findings at once.
          errors.extend(f'{folder}: missing tracked folder .meta file' for folder in sorted(folders) if folder + '.meta' not in files)
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'Repository checks passed: {len(files)} tracked files, {len(guids)} unique asset GUIDs.')
          PY

      # Restore dependencies kept outside Git, preserving their Assets paths and original .meta files.
      - name: Download external Spine and TMP dependencies
        env:
          # Store the direct HTTPS download URL as a secret and the expected ZIP hash as a variable.
          CI_DEPENDENCIES_URL: ${{ secrets.CI_DEPENDENCIES_URL }}
          CI_DEPENDENCIES_SHA256: ${{ vars.CI_DEPENDENCIES_SHA256 }}
        run: |
          # Stop immediately if either dependency setting has not been configured.
          test -n "$CI_DEPENDENCIES_URL"
          test -n "$CI_DEPENDENCIES_SHA256"
          # Download via HTTPS, including redirects, and fail on HTTP errors.
          curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' "$CI_DEPENDENCIES_URL" -o "$RUNNER_TEMP/dependencies.zip"
          # Verify the exact archive bytes before extracting them into the Unity project.
          printf '%s  %s\n' "$CI_DEPENDENCIES_SHA256" "$RUNNER_TEMP/dependencies.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/dependencies.zip" -d "$GITHUB_WORKSPACE"

      # Reuse imported assets to speed up later runs; Unity still imports changed assets and compiles.
      - name: Cache Unity imports
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: Library
          # Separate caches by Unity version, build target, dependency archive and project files.
          key: Library-6000.3.22f1-WebGL-${{ vars.CI_DEPENDENCIES_SHA256 }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          # If no exact cache exists, start from an older cache with the same version/target/dependencies.
          restore-keys: |
            Library-6000.3.22f1-WebGL-${{ vars.CI_DEPENDENCIES_SHA256 }}-

      # Use the required Unity version to import the project, compile scripts and build enabled scenes.
      # Compiler/build errors fail the job; this step does not run a gameplay round.
      - name: Import, compile and build WebGL
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          # GameCI uses these repository secrets to activate Unity on the temporary runner.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.22f1
          targetPlatform: WebGL
          buildsPath: build
          # Keep the project's version unchanged; the editor entry point chooses scenes and reports failure.
          versioning: None
          buildMethod: Game.Editor.CiBuild.BuildWebGL
          # CiBuild explicitly exits the editor with code 0 on success or 1 on failure.
          manualExit: true

      # Confirm that a non-empty WebGL entry page was produced; no artifact upload or deployment is needed.
      - name: Verify build output
        run: test -n "$(find build -type f -name index.html -size +0c -print -quit)"
